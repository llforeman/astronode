<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Astronode — Your Personalized Horoscope{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}Personalized AI-powered horoscope readings based on your birth chart.{% endblock %}">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0d0d1a; --bg2: #151528; --text: #e8e0f0; --text-muted: #8a7fa0;
      --accent: #9b59b6; --accent-light: #c39bd3; --border: #2a2a45; --card: #1a1a30;
    }
    :root[data-theme="light"] {
      --bg: #f5f0ff; --bg2: #ffffff; --text: #1a0a2e; --text-muted: #6b5b80;
      --accent: #7d3c98; --accent-light: #9b59b6; --border: #d8c8e8; --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
    a { color: var(--accent-light); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav.topnav { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    nav.topnav .logo { font-size: 1.3rem; font-weight: 700; color: var(--accent-light); letter-spacing: 2px; }
    nav.topnav .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .container { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
    .btn { display: inline-block; padding: 0.6rem 1.5rem; border-radius: 6px; border: none; cursor: pointer; font-size: 1rem; transition: all 0.2s; text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-light); color: #fff; text-decoration: none; }
    .btn-outline { background: transparent; color: var(--accent-light); border: 1px solid var(--accent); }
    .flash { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; background: var(--border); color: var(--text); max-width: 960px; margin: 0 auto 1rem; }
    .theme-toggle { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 0.3rem 0.7rem; border-radius: 6px; cursor: pointer; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <nav class="topnav">
    <a href="{{ url_for('public.landing') }}" class="logo">✦ ASTRONODE</a>
    <div class="nav-links">
      <a href="{{ url_for('public.chart') }}">Carta Natal</a>
      <a href="{{ url_for('public.pricing') }}">Pricing</a>
      <a href="{{ url_for('auth.login') }}">Log in</a>
      <a href="{{ url_for('auth.register') }}" class="btn btn-primary">Get started</a>
      <button class="theme-toggle" onclick="toggleTheme()">◐</button>
    </div>
  </nav>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
  <script>
    function toggleTheme() {
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
