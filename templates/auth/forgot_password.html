<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña — Astronode</title>
  <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('theme')||'dark'); })();</script>
  <style>
    :root[data-theme="dark"]{--bg:#0d0d1a;--text:#e8e0f0;--text-muted:#8a7fa0;--accent:#9b59b6;--border:#2a2a45;--card:#1a1a30;}
    :root[data-theme="light"]{--bg:#f5f0ff;--text:#1a0a2e;--text-muted:#6b5b80;--accent:#7d3c98;--border:#d8c8e8;--card:#ffffff;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2.5rem;width:100%;max-width:380px;}
    .logo{text-align:center;font-size:1.4rem;font-weight:700;color:var(--accent);margin-bottom:2rem;letter-spacing:2px;}
    label{display:block;font-size:0.85rem;color:var(--text-muted);margin-bottom:0.3rem;}
    input{width:100%;padding:0.6rem 0.8rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.95rem;margin-bottom:1rem;}
    .btn{width:100%;padding:0.7rem;border-radius:6px;border:none;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer;}
    .flash{padding:0.6rem 0.8rem;border-radius:6px;background:var(--border);margin-bottom:1rem;font-size:0.9rem;}
    .links{text-align:center;margin-top:1rem;font-size:0.9rem;color:var(--text-muted);}
    .links a{color:var(--accent);}
    p{color:var(--text-muted);font-size:0.9rem;margin-bottom:1.5rem;}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">✦ ASTRONODE</div>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    <p>Introduce tu email y te enviaremos un enlace para restablecer tu contraseña.</p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email</label>
      <input type="email" name="email" required autofocus>
      <button type="submit" class="btn">Enviar enlace</button>
    </form>
    <div class="links"><a href="{{ url_for('auth.login') }}">← Volver al inicio de sesión</a></div>
  </div>
</body>
</html>
