<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family:'Segoe UI',sans-serif; background:#0d0d1a; color:#e8e0f0; padding:2rem;">
  <div style="max-width:600px; margin:0 auto; background:#1a1a30; border-radius:12px; padding:2rem;">
    <h2 style="color:#c39bd3; margin-bottom:0.5rem;">✦ ASTRONODE</h2>
    <h3 style="color:#e8e0f0; margin-bottom:1.5rem;">Your {{ reading.reading_type.name }} is ready</h3>
    <div style="background:#0d0d1a; border-radius:8px; padding:1.5rem; line-height:1.8; white-space:pre-wrap; margin-bottom:1.5rem;">{{ reading.content }}</div>
    <div style="text-align:center;">
      <a href="{{ link }}" style="background:#9b59b6; color:#fff; padding:0.75rem 2rem; border-radius:6px; text-decoration:none;">View on Astronode</a>
    </div>
    <p style="color:#8a7fa0; font-size:0.85rem; margin-top:1.5rem;">You received this because you have an Astronode account.</p>
  </div>
</body>
</html>
